  </defs>
  <rect width="64" height="64" rx="8" fill="#dcb37a"/>
  <circle cx="24" cy="28" r="13" fill="#111111"/>
  <circle cx="38" cy="34" r="13" fill="#f5f5f0" stroke="#999" stroke-width="1"/>
  <circle cx="38" cy="40" r="2.5" fill="#333"/>
