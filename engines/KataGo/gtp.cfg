# KataGo config bundled with YiGo for development testing.
# Minimum set: KataGo aborts with "Could not find key 'X' in config" if the
# logging keys below are missing, which YiGo can only report as a crash.
logDir = /tmp/katago_logs
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true

rules = tromp-taylor
# YiGo's internal convention is black-perspective winrate; KataGo defaults to
# SIDETOMOVE, which would flip the chart whenever white is to move.
reportAnalysisWinratesAs = BLACK

# CPU-only (Eigen) build: keep search small so analysis stays responsive.
numSearchThreads = 4
maxVisits = 300
ponderingEnabled = false
